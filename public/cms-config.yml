# ---------------------------------------------------------------------------
# Sveltia CMS - a Git-based headless CMS.
# Every article edited here is written back as a Markdown file in this
# repository, under /content. Nothing is stored in a database.
#
# How the section edits: clone the repository, `npm run dev`, open
# http://localhost:4321/cogent-union/admin/ in Chrome or Edge and choose
# "Work with Local Repository". Saves are written to the files on disk, and
# become public when they are committed and pushed.
#
# The GitHub backend below is the fallback for editing without a checkout:
# "Sign In with GitHub Using PAT" and a token scoped to this repository.
# A hosted OAuth endpoint (`base_url`) would replace the token; see README.
# ---------------------------------------------------------------------------
backend:
  name: github
  repo: Sorikairox/cogent-union
  branch: main
  # base_url: https://auth.example.org

# Lets the CMS write to the working copy instead of calling the GitHub API.
local_backend: true

# Only applies when signed in to GitHub: a save opens a pull request instead of
# committing to the branch. Set to `simple` to publish directly.
publish_mode: editorial_workflow

media_folder: public/uploads
# Root-relative on purpose. The site's base path is added when the page is
# built (see src/lib/rehype-base-urls.mjs), so moving to a custom domain or a
# different sub-path needs no change to the stored content.
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [en, ja]
  default_locale: en

collections:
  - name: statements
    label: Statements
    label_singular: Statement
    folder: content/statements
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    i18n: true
    summary: '{{title}} - {{pubDate}}'
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Summary, widget: text, required: false, i18n: true }
      - name: pubDate
        label: Publication date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        i18n: duplicate
      - name: updatedDate
        label: Last updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
        i18n: true
      - name: translationKey
        label: Translation key
        widget: string
        i18n: duplicate
        hint: >-
          The same value in every language. This is what links the English and
          Japanese versions of one article together.
      - name: topics
        label: Topics
        widget: list
        required: false
        i18n: true
        hint: Translate the labels - each language has its own list of topics.
      - { name: author, label: Author, widget: string, required: false, i18n: true }
      - { name: cover, label: Cover image, widget: image, required: false, i18n: duplicate }
      - { name: coverAlt, label: Cover image description, widget: string, required: false, i18n: true }
      - name: featured
        label: Featured on the home page
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: false
        required: false
        i18n: true
        hint: A draft is never published. It can be set per language.
      - { name: body, label: Body, widget: markdown, i18n: true }

